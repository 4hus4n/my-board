name: Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Copy the web app into the Android assets
        run: python3 android/prepare_assets.py

      - name: Build the APK
        working-directory: android
        env:
          VERSION_CODE: ${{ github.run_number }}
        run: gradle --no-daemon assembleRelease

      - name: Name the APK
        run: cp android/app/build/outputs/apk/release/app-release.apk my-board.apk

      - uses: actions/upload-artifact@v4
        with:
          name: my-board-apk
          path: my-board.apk

      - name: Publish to the "apk" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete apk --yes --cleanup-tag || true
          gh release create apk my-board.apk \
            --target "${{ github.sha }}" \
            --title "My Board app (build ${{ github.run_number }})" \
            --notes "Android app for My Board, built from commit ${{ github.sha }}. Install my-board.apk on the phone or tablet." \
            --latest
