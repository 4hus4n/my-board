<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#10131f">
<title>My Board</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Andika:wght@400;700&family=Caveat:wght@700&family=Fredoka:wght@700&family=Noto+Naskh+Arabic:wght@500&family=Noto+Sans+Thaana:wght@500&display=swap">
<style>
/* Optional Dhivehi font: place the file at fonts/MV_AammuFK_Regular.ttf next to this page.
   When it is missing, Thaana falls back to Noto Sans Thaana. */
@font-face { font-family: "MV Aammu FK"; src: url("fonts/MV_AammuFK_Regular.ttf") format("truetype"); font-display: swap; }
/* Layout: full-bleed drawing slate; one floating tool bar at the bottom, tracing bar at the top. Single dark look by design. */
:root {
  --slate: #10131f;      /* drawing surface */
  --panel: #1b1f33;      /* tool bar */
  --panel-2: #252a44;    /* raised button */
  --line: #313858;       /* borders, ruled lines */
  --text: #eef0fa;
  --muted: #8d94b8;
  --sun: #ffd84a;        /* active tool, focus */
  --danger: #ff6b6b;
  --font-ui: "Andika", "Trebuchet MS", system-ui, sans-serif;
  --b: 64px;              /* button size; set from the screen height in JS */
  color-scheme: dark;
}
[hidden] { display: none !important; }
html, body { height: 100%; }
body {
  background: var(--slate);
  color: var(--text);
  font-family: var(--font-ui);
  overflow: hidden;
  overscroll-behavior: none;
  touch-action: none;
  -webkit-user-select: none; user-select: none;
  -webkit-touch-callout: none;
  -webkit-tap-highlight-color: transparent;
}
#guide, #ink { position: fixed; left: 0; top: 0; display: block; }
#guide { z-index: 1; pointer-events: none; }
#ink { z-index: 2; touch-action: none; cursor: crosshair; }

/* ---------- Side panels: drawing tools on the left, letters and grown-up buttons on the right ---------- */
.side {
  position: fixed; top: 0; bottom: 0; z-index: 10;
  display: flex; align-items: center;
  padding-block: 10px;
  pointer-events: none;
}
.side.left { left: 0; padding-left: max(10px, env(safe-area-inset-left, 0px)); }
.side.right { right: 0; padding-right: max(10px, env(safe-area-inset-right, 0px)); }
.panel {
  pointer-events: auto;
  display: grid; grid-template-columns: var(--b); gap: 8px;
  justify-items: center; align-items: center;
  max-height: 100%;
  padding: 7px;
  background: var(--panel); border: 1px solid var(--line); border-radius: 22px;
  box-shadow: 0 10px 30px rgba(0,0,0,.45);
  overflow-y: auto; scrollbar-width: none;
}
.panel::-webkit-scrollbar { display: none; }
.wide { grid-column: 1 / -1; }
.sep { grid-column: 1 / -1; justify-self: stretch; height: 1px; margin: 2px 4px; background: var(--line); }

.btn {
  width: var(--b); height: var(--b);
  display: grid; place-items: center;
  border: 0; border-radius: 15px;
  background: transparent; color: var(--text);
  cursor: pointer; touch-action: manipulation;
  font: inherit;
}
.btn svg { width: calc(var(--b) * .48); height: calc(var(--b) * .48); fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.btn:active { background: var(--panel-2); }
.btn[aria-pressed="true"] { background: var(--sun); color: #1a1a1a; }
.btn:disabled { opacity: .3; cursor: default; }
.btn:focus-visible, .chip:focus-visible, .sw:focus-visible { outline: 3px solid var(--sun); outline-offset: 2px; }

.rainbow-ic { background: conic-gradient(#ff4d5e, #ffe14d, #7be36b, #4dc3ff, #a77bff, #ff6ec7, #ff4d5e); width: calc(var(--b) * .5); height: calc(var(--b) * .5); border-radius: 50%; border: 3px solid var(--panel); box-shadow: 0 0 0 2px currentColor; }
.btn[aria-pressed="true"] .rainbow-ic { border-color: var(--sun); }

.cur-color {
  width: calc(var(--b) * .58); height: calc(var(--b) * .58); border-radius: 50%;
  background: var(--c, #fff);
  box-shadow: 0 0 0 3px var(--panel), 0 0 0 5px var(--text);
}
.sw {
  flex: none; width: 32px; height: 32px; border-radius: 50%;
  border: 0; padding: 0; cursor: pointer; touch-action: manipulation;
  background: var(--c);
}
.sw[aria-pressed="true"] { box-shadow: 0 0 0 3px var(--panel), 0 0 0 5px var(--sun); }

.size-dot { display: block; border-radius: 50%; background: var(--text); }
#sizeBtn { box-shadow: inset 0 0 0 2px var(--line); }

/* ---------- Pop-out panels (size, menu) ---------- */
.pop {
  position: fixed; z-index: 12; top: 50%; transform: translateY(-50%);
  display: grid; gap: 8px; align-content: start;
  width: min(340px, calc(100% - var(--b) * 2 - 100px));
  max-height: calc(100% - 20px); overflow-y: auto; overscroll-behavior: contain;
  padding: 14px;
  background: var(--panel); border: 1px solid var(--line); border-radius: 22px;
  box-shadow: 0 16px 40px rgba(0,0,0,.5);
}
.pop-left { left: calc(var(--b) + 44px); }
.pop-right { right: calc(var(--b) + 44px); }
.pop-title { color: var(--muted); font-size: 13px; text-transform: uppercase; letter-spacing: .08em; padding: 4px 4px 0; }
.pop-note { color: var(--muted); font-size: 14px; padding: 0 4px 6px; font-variant-numeric: tabular-nums; }
.size-row { display: flex; gap: 8px; justify-content: space-between; }
.size-opt {
  flex: 1; aspect-ratio: 1; max-width: 64px; display: grid; place-items: center;
  border: 0; border-radius: 16px; background: var(--panel-2); cursor: pointer; touch-action: manipulation;
}
.size-opt i { display: block; border-radius: 50%; background: var(--text); }
.size-opt[aria-pressed="true"] { box-shadow: inset 0 0 0 3px var(--sun); }
.mi {
  display: flex; align-items: center; gap: 12px;
  min-height: 54px; padding: 0 14px;
  border: 0; border-radius: 14px; background: var(--panel-2); color: var(--text);
  font: 400 17px var(--font-ui); text-align: left; cursor: pointer; touch-action: manipulation;
}
.mi svg { width: 26px; height: 26px; flex: none; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.mi span { flex: 1; }
.mi:disabled { opacity: .35; }
.mi:focus-visible, .size-opt:focus-visible { outline: 3px solid var(--sun); outline-offset: 2px; }
.tog { width: 44px; height: 26px; border-radius: 13px; background: var(--line); position: relative; flex: none; }
.tog::after { content: ""; position: absolute; top: 3px; left: 3px; width: 20px; height: 20px; border-radius: 50%; background: var(--text); transition: transform .15s; }
.mi[aria-pressed="true"] .tog { background: var(--sun); }
.mi[aria-pressed="true"] .tog::after { transform: translateX(18px); background: #1a1a1a; }
.set-chips { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; }
.set-chip {
  height: 48px; border: 0; border-radius: 12px; cursor: pointer; touch-action: manipulation;
  background: var(--panel-2); color: var(--muted); font: 700 17px var(--font-ui);
}
.set-chip[aria-pressed="true"] { color: var(--text); box-shadow: inset 0 -3px 0 var(--sun); }
.letter-btn { position: relative; background: var(--panel-2); }
.letter-btn .letter { font-size: calc(var(--b) * .56); line-height: 1; font-weight: 700; }
.letter-btn .say-ic { position: absolute; right: 3px; bottom: 3px; width: calc(var(--b) * .26); height: calc(var(--b) * .26); opacity: .7; }

/* ---------- Colour sheet ---------- */
.sheet {
  position: fixed; z-index: 11;
  left: calc(var(--b) + 44px); top: 50%; transform: translateY(-50%);
  width: min(460px, calc(100% - var(--b) * 2 - 100px));
  padding: 14px;
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 22px;
  box-shadow: 0 16px 40px rgba(0,0,0,.5);
  display: grid; gap: 12px;
}
.grid { display: grid; grid-template-columns: repeat(10, minmax(0, 1fr)); gap: 7px; }
.grid .sw { width: 100%; height: auto; aspect-ratio: 1; }
.sheet-row { display: flex; gap: 10px; align-items: center; justify-content: space-between; flex-wrap: wrap; }
.mix { display: flex; align-items: center; gap: 10px; color: var(--muted); font-size: 15px; cursor: pointer; }
.mix input { width: 44px; height: 44px; border: 0; padding: 0; background: none; cursor: pointer; }
.pill {
  border: 1px solid var(--line); background: var(--panel-2); color: var(--text);
  font: inherit; font-size: 15px; border-radius: 999px; padding: 10px 16px; cursor: pointer; touch-action: manipulation;
}

/* ---------- Tracing controls ---------- */
.trace-ctl { display: contents; }
.set-btn {
  width: var(--b); height: var(--b);
  border: 0; border-radius: 13px; cursor: pointer; touch-action: manipulation;
  background: var(--panel-2); color: var(--text);
  font: 700 18px var(--font-ui);
  box-shadow: inset 0 -3px 0 var(--sun);
}
.letter-box { display: grid; justify-items: center; gap: 1px; padding-block: 2px; }
.letter { font-size: 36px; font-weight: 700; line-height: 1.2; }
.word { color: var(--muted); font-size: 12px; white-space: nowrap; max-width: calc(var(--b) + 8px); overflow: hidden; text-overflow: ellipsis; }
.count { color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; }

/* ---------- Lock ---------- */
.lock-btn { position: relative; }
.lock-btn .ring {
  position: absolute; inset: 2px; border-radius: 13px; pointer-events: none;
  background: conic-gradient(var(--sun) calc(var(--p, 0) * 1turn), transparent 0);
  -webkit-mask: radial-gradient(circle, transparent 58%, #000 60%);
          mask: radial-gradient(circle, transparent 58%, #000 60%);
}
body.locked .adult { display: none !important; }
body.locked .lock-btn { color: var(--sun); }

/* ---------- Toast ---------- */
.toast {
  position: fixed; z-index: 20; left: 50%; transform: translateX(-50%);
  bottom: calc(16px + env(safe-area-inset-bottom, 0px));
  max-width: calc(100% - var(--b) * 2 - 80px);
  background: var(--text); color: var(--slate);
  font-size: 16px; padding: 10px 18px; border-radius: 999px;
  box-shadow: 0 8px 24px rgba(0,0,0,.4);
  transition: opacity .2s;
}


/* ---------- Landscape app: when the screen is upright, the whole app is turned sideways ---------- */
#app { position: fixed; left: 0; top: 0; overflow: hidden; background: var(--slate); }
body.rotated #app { transform-origin: top left; transform: rotate(90deg) translateY(-100%); }

/* ---------- Celebration ---------- */
.cheer {
  position: fixed; inset: 0; z-index: 30; pointer-events: none;
  display: grid; place-items: center;
}
.cheer canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
.cheer-card {
  position: relative;
  display: flex; flex-direction: column; align-items: center; gap: 4px;
  padding: 18px 34px 22px;
  background: #fff7d6; color: #3b2a00;
  border-radius: 36px;
  box-shadow: 0 0 0 6px var(--sun), 0 18px 0 -2px rgba(0,0,0,.35);
  animation: pop .55s cubic-bezier(.2, 1.6, .4, 1) both;
}
.cheer.out .cheer-card { animation: away .35s ease-in both; }
.cheer-star { font-size: 0; width: 64px; height: 64px; animation: spin 1.2s ease-in-out both; }
.cheer-star svg { width: 100%; height: 100%; }
.cheer-text { display: flex; font-family: "Fredoka", var(--font-ui); font-weight: 700; font-size: clamp(30px, 7vmin, 56px); line-height: 1.05; }
.cheer-text span { display: inline-block; animation: hop .6s ease-out both; animation-delay: calc(var(--i) * 45ms + .2s); }
@keyframes pop { 0% { transform: scale(.2) rotate(-12deg); opacity: 0; } 100% { transform: scale(1) rotate(-3deg); opacity: 1; } }
@keyframes away { to { transform: scale(.4) translateY(-30%); opacity: 0; } }
@keyframes hop { 0% { transform: translateY(0); } 40% { transform: translateY(-18px) rotate(-6deg); } 100% { transform: translateY(0); } }
@keyframes spin { 0% { transform: scale(0) rotate(-180deg); } 70% { transform: scale(1.25) rotate(15deg); } 100% { transform: scale(1) rotate(0); } }

/* ---------- Start-up: "My Board" written by hand ---------- */
.splash {
  position: fixed; inset: 0; z-index: 60;
  display: grid; place-items: center;
  background: var(--slate);
  transition: opacity .6s ease, transform .6s ease;
}
.splash.gone { opacity: 0; transform: scale(1.03); pointer-events: none; }
.splash-inner { display: grid; justify-items: center; }
.splash-word {
  display: flex;
  font-family: "Caveat", "Comic Sans MS", cursive; font-weight: 700;
  font-size: clamp(72px, 17vmin, 170px); line-height: 1;
}
.splash-word span {
  display: inline-block;
  opacity: 0;
  clip-path: inset(-60% 105% -60% -60%);
  transform: translateY(14px) rotate(-5deg);
  text-shadow: 0 5px 0 rgba(0,0,0,.28);
  animation: ink .8s cubic-bezier(.22, .8, .25, 1) forwards;
  animation-delay: var(--d);
  will-change: clip-path, transform, opacity;
}
.splash-word .gap { width: .3em; }
@keyframes ink {
  0% { opacity: 0; clip-path: inset(-60% 105% -60% -60%); transform: translateY(14px) rotate(-5deg); }
  12% { opacity: 1; }
  100% { opacity: 1; clip-path: inset(-60% -60% -60% -60%); transform: none; }
}
.splash-line { width: 100%; height: auto; margin-top: -4px; overflow: visible; }
.splash-line path {
  fill: none; stroke: var(--sun); stroke-width: 8; stroke-linecap: round;
  stroke-dasharray: 700; stroke-dashoffset: 700;
  animation: write .7s cubic-bezier(.4, 0, .2, 1) forwards; animation-delay: var(--d, 2.5s);
}
@keyframes write { to { stroke-dashoffset: 0; } }
.splash-credit {
  position: absolute; left: 0; right: 0; bottom: calc(22px + env(safe-area-inset-bottom, 0px));
  text-align: center; color: var(--muted); font-size: 16px; letter-spacing: .02em;
  opacity: 0; animation: rise .9s ease forwards; animation-delay: 1.3s;
}
@keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
.cc {
  font-weight: 700;
  background: linear-gradient(90deg, #ff4d5e, #ff8a2a, #ffe14d, #7be36b, #4dc3ff, #a77bff, #ff6ec7, #ff4d5e);
  background-size: 200% 100%;
  -webkit-background-clip: text; background-clip: text;
  color: transparent;
  animation: ccflow 2.6s linear infinite;
}
@keyframes ccflow { from { background-position: 0% 0; } to { background-position: 200% 0; } }

/* ---------- Finished a whole set ---------- */
.finish {
  position: fixed; inset: 0; z-index: 40;
  display: grid; place-items: center;
  background: rgba(8, 10, 18, .72);
}
.finish-card {
  display: grid; justify-items: center; gap: 12px;
  max-width: calc(100% - var(--b) * 2 - 60px); max-height: calc(100% - 24px);
  padding: 16px 20px;
  background: var(--panel); border: 1px solid var(--line); border-radius: 26px;
  box-shadow: 0 0 0 5px var(--sun), 0 20px 50px rgba(0,0,0,.5);
  animation: popin .5s cubic-bezier(.2, 1.5, .4, 1) both;
}
@keyframes popin { from { transform: scale(.6); opacity: 0; } to { transform: none; opacity: 1; } }
.finish-title { font-family: "Fredoka", var(--font-ui); font-weight: 700; font-size: 26px; color: var(--sun); text-align: center; }
.finish-card canvas { display: block; border-radius: 12px; max-width: 100%; }
.finish-row { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
.pill.sun { background: var(--sun); color: #1a1a1a; border-color: var(--sun); font-weight: 700; }

@media (prefers-reduced-motion: reduce) {
  .splash-word span { animation: none; opacity: 1; clip-path: none; transform: none; }
  .splash-line path { animation: none; stroke-dashoffset: 0; }
  .splash-credit, .cc, .finish-card { animation: none; opacity: 1; }
  .toast { transition: none; }
  .cheer-card, .cheer.out .cheer-card, .cheer-star, .cheer-text span { animation: none; }
}
</style>
<style>html,body{margin:0;height:100%}</style>
</head>
<body>
<div id="app">
<canvas id="guide"></canvas>
<canvas id="ink" aria-label="Drawing area"></canvas>

<div class="cheer" id="cheer" hidden>
  <canvas id="confetti"></canvas>
  <div class="cheer-card">
    <div class="cheer-star"><svg viewBox="0 0 64 64"><path d="M32 4l8.6 17.5 19.4 2.8-14 13.6 3.3 19.3L32 48.1 14.7 57.2 18 37.9 4 24.3l19.4-2.8z" fill="#ffd84a" stroke="#e8a400" stroke-width="3" stroke-linejoin="round"/><circle cx="25" cy="31" r="2.6" fill="#3b2a00"/><circle cx="39" cy="31" r="2.6" fill="#3b2a00"/><path d="M26 38q6 5 12 0" fill="none" stroke="#3b2a00" stroke-width="2.6" stroke-linecap="round"/></svg></div>
    <div class="cheer-text" id="cheerText"></div>
  </div>
</div>

<div class="sheet" id="sheet" hidden>
  <div class="grid" id="grid"></div>
  <div class="sheet-row">
    <label class="mix" for="customColor"><input type="color" id="customColor" value="#ff9f1c"> Mix your own</label>
    <button class="pill" id="sheetRainbow">Rainbow pen</button>
  </div>
</div>

<div class="side left">
  <div class="panel" id="bar">
    <button class="btn" id="tPen" aria-pressed="true" aria-label="Pen" title="Pen">
      <svg viewBox="0 0 24 24"><path d="M4 20l4-1 11-11-3-3L5 16l-1 4z"/><path d="M14 7l3 3"/></svg>
    </button>
    <button class="btn" id="tErase" aria-pressed="false" aria-label="Eraser" title="Eraser">
      <svg viewBox="0 0 24 24"><path d="M8 20h12"/><path d="M4.5 15.5l9-9a2 2 0 0 1 2.8 0l2.2 2.2a2 2 0 0 1 0 2.8L11 19H8l-3.5-3.5z"/><path d="M9 11l5 5"/></svg>
    </button>
    <button class="btn" id="colorBtn" aria-label="Colours" title="Colours"><span class="cur-color" id="curColor"></span></button>
    <button class="btn" id="sizeBtn" aria-label="Pen size" title="Pen size"><i class="size-dot" id="sizeDot"></i></button>
    <button class="btn" id="undo" aria-label="Undo" title="Undo" disabled>
      <svg viewBox="0 0 24 24"><path d="M9 14L4 9l5-5"/><path d="M4 9h10a6 6 0 0 1 0 12h-3"/></svg>
    </button>
  </div>
</div>

<div class="side right">
  <div class="panel" id="rightBar">
    <div class="trace-ctl" id="traceBar" hidden>
      <button class="btn letter-btn" id="sayL" aria-label="Say the letter" title="Say the letter">
        <span class="letter" id="letterNow">A</span>
        <svg class="say-ic" viewBox="0 0 24 24"><path d="M4 9v6h4l5 4V5L8 9H4z"/><path d="M16.5 8.5a5 5 0 0 1 0 7"/></svg>
      </button>
      <button class="btn" id="prevL" aria-label="Previous letter"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button>
      <button class="btn" id="nextL" aria-label="Next letter"><svg viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg></button>
    </div>
    <button class="btn adult" id="menuBtn" aria-label="More options" title="More options">
      <svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
    </button>
    <button class="btn lock-btn" id="lock" aria-label="Child lock" title="Child lock">
      <span class="ring"></span>
      <svg viewBox="0 0 24 24" id="lockIcon"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0"/></svg>
    </button>
  </div>
</div>

<div class="pop pop-left" id="sizePop" hidden>
  <div class="pop-title">Size</div>
  <div class="size-row" id="sizeRow"></div>
</div>

<div class="pop pop-right" id="menu" hidden>
  <div class="pop-title">Letter tracing</div>
  <button class="mi" id="traceBtn" aria-pressed="false">
    <svg viewBox="0 0 24 24"><path d="M5 20L12 4l7 16" stroke-dasharray="2.5 2.5"/><path d="M8 14h8" stroke-dasharray="2.5 2.5"/></svg><span>Tracing</span><b class="tog"></b>
  </button>
  <div class="set-chips" id="setChips"></div>
  <button class="mi" id="autoNext" aria-pressed="true">
    <svg viewBox="0 0 24 24"><path d="M4 6l7 6-7 6z"/><path d="M12 6l7 6-7 6z"/></svg><span>Auto next letter</span><b class="tog"></b>
  </button>
  <button class="mi" id="setDl" hidden>
    <svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><path d="M17.5 13v8M14.5 18l3 3 3-3"/></svg><span>Download traced letters</span>
  </button>
  <div class="pop-note"><span id="letterCount">1 / 26</span> · <span id="letterWord">Apple</span></div>
  <div class="pop-title">Board</div>
  <button class="mi" id="redo" disabled>
    <svg viewBox="0 0 24 24"><path d="M15 14l5-5-5-5"/><path d="M20 9H10a6 6 0 0 0 0 12h3"/></svg><span>Redo</span>
  </button>
  <button class="mi" id="clear">
    <svg viewBox="0 0 24 24"><path d="M4 7h16"/><path d="M10 11v6M14 11v6"/><path d="M6 7l1 13h10l1-13"/><path d="M9 7V4h6v3"/></svg><span>Clear board</span>
  </button>
  <button class="mi" id="save">
    <svg viewBox="0 0 24 24"><path d="M12 4v11"/><path d="M7 10l5 5 5-5"/><path d="M5 20h14"/></svg><span>Save picture</span>
  </button>
  <button class="mi" id="fs">
    <svg viewBox="0 0 24 24" id="fsIcon"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg><span id="fsText">Full screen</span>
  </button>
</div>

<div class="toast" id="toast" hidden></div>

<script>
(() => {
  const $ = (s) => document.querySelector(s);
  const ink = $('#ink'), guide = $('#guide');
  const ictx = ink.getContext('2d');
  const gctx = guide.getContext('2d');
  const base = document.createElement('canvas');
  base.width = 0; base.height = 0;
  const bctx = base.getContext('2d');
  const BG = '#10131f';

  let DPR = 1, W = 0, H = 0, rotated = false;
  // screen point -> point on the (possibly turned) board
  const toBoard = (e) => rotated ? [e.clientY, H - e.clientX] : [e.clientX, e.clientY];

  /* ---------------- State ---------------- */
  let tool = 'pen';            // pen | rain | eraser
  let color = '#ffe14d';
  const sizes = { pen: 12, rain: 12, eraser: 40 };
  let hueSeed = 0;
  const hist = [];             // strokes still undoable
  const redoStack = [];
  const MAX_HIST = 60;         // older strokes are baked into the base canvas
  let cur = null, curId = null;
  let locked = false, wantFs = false;
  let baseInk = false;         // true when baked strokes are still visible

  /* ---------------- Canvas sizing ---------------- */
  function resize() {
    DPR = Math.min(window.devicePixelRatio || 1, 3);
    // Always lay the app out in landscape; an upright screen just shows it turned sideways.
    rotated = window.innerHeight > window.innerWidth;
    W = rotated ? window.innerHeight : window.innerWidth;
    H = rotated ? window.innerWidth : window.innerHeight;
    const app = document.getElementById('app');
    app.style.width = W + 'px'; app.style.height = H + 'px';
    const b = document.body.classList;
    b.toggle('rotated', rotated);
    b.toggle('short', H < 460);
    // big buttons: five per side must fit the height (phones ~60px, tablets up to 88px)
    const btn = Math.max(48, Math.min(88, Math.floor((H - 36 - 4 * 8) / 5)));
    document.documentElement.style.setProperty('--b', btn + 'px');
    for (const c of [ink, guide]) {
      c.width = Math.round(W * DPR); c.height = Math.round(H * DPR);
      c.style.width = W + 'px'; c.style.height = H + 'px';
    }
    const need = Math.ceil(Math.max(W, H, screen.width || 0, screen.height || 0) * DPR);
    if (base.width < need) {
      const tmp = document.createElement('canvas');
      tmp.width = base.width; tmp.height = base.height;
      if (base.width) tmp.getContext('2d').drawImage(base, 0, 0);
      base.width = base.height = need;
      if (tmp.width) bctx.drawImage(tmp, 0, 0);
    }
    replay();
    drawGuide();
  }
  let rz = 0;
  window.addEventListener('resize', () => { cancelAnimationFrame(rz); rz = requestAnimationFrame(resize); });

  /* ---------------- Stroke rendering ---------------- */
  const colorAt = (s, i) => s.t === 'rain' ? `hsl(${(s.h0 + i * 4) % 360} 95% 62%)` : s.c;

  function setup(c, s) {
    c.lineCap = 'round'; c.lineJoin = 'round';
    c.lineWidth = s.s;
    c.globalCompositeOperation = s.t === 'eraser' ? 'destination-out' : 'source-over';
  }

  // Draw the piece of the stroke that ends at point i (smoothed with midpoints).
  function seg(c, s, i) {
    const p = s.p, n = i * 2;
    if (i === 0) {
      c.beginPath(); c.arc(p[0], p[1], s.s / 2, 0, Math.PI * 2);
      c.fillStyle = colorAt(s, 0); c.fill();
      return;
    }
    const x1 = p[n - 2], y1 = p[n - 1], x2 = p[n], y2 = p[n + 1];
    const x0 = i >= 2 ? (p[n - 4] + x1) / 2 : x1;
    const y0 = i >= 2 ? (p[n - 3] + y1) / 2 : y1;
    c.strokeStyle = colorAt(s, i);
    c.beginPath(); c.moveTo(x0, y0);
    c.quadraticCurveTo(x1, y1, (x1 + x2) / 2, (y1 + y2) / 2);
    c.stroke();
  }
  function tail(c, s) {
    const p = s.p, k = p.length;
    if (k < 4) return;

    for (const c of comps) {
      // Small parts (dots, the dot on i/j) must each be touched on their own,
      // with a tight reach so tracing the body next to them does not count.
      const small = c.cells.length < all * 0.15;
      const reach = small ? Math.max(1, Math.min(r, Math.round(c.size / 2))) : r;
      let hit = 0;
      for (const i of c.cells) if (boxSum(PI, gw, gh, i % gw, (i / gw) | 0, reach)) hit++;
      if (small) { if (hit / c.cells.length < 0.6) return false; }
      else { body += c.cells.length; bodyHit += hit; }
    }
    let outside = 0;
    for (let i = 0; i < inkG.length; i++) if (inkG[i] && !boxSum(PM, gw, gh, i % gw, (i / gw) | 0, r)) outside++;
    // most of the letter traced, every dot touched, and not just scribbling over the board
    return (body === 0 || bodyHit / body >= 0.88) && outside / inkTotal <= 0.35;
  }
  function scheduleCheck() {
    clearTimeout(checkT);
    if (!trace.on || !trace.auto || advancing) return;
    checkT = setTimeout(() => { if (curId === null && traced()) celebrate(); }, 650);
  }

  /* ---------------- Celebration ---------------- */
  const PRAISE = ['Well done!', 'Great job!', 'Super!', 'You did it!', 'Amazing!', 'Fantastic!'];
  const FUN = ['#ff4d5e', '#ff8a2a', '#e8a400', '#2ecc40', '#00a3c7', '#1f7cff', '#7b3dff', '#ff2fa0'];
  const cheer = $('#cheer'), cheerText = $('#cheerText'), conf = $('#confetti'), cctx = conf.getContext('2d');
  let confRaf = 0;

  function showCheer(msg) {
    cheerText.textContent = '';
    [...msg].forEach((ch, i) => {
      const s = document.createElement('span');
      s.textContent = ch === ' ' ? ' ' : ch;
      s.style.setProperty('--i', i);
      s.style.color = FUN[i % FUN.length];
      cheerText.appendChild(s);
    });
    cheer.classList.remove('out');
    cheer.hidden = false;
    // restart the CSS animations
    const card = cheer.querySelector('.cheer-card');
    card.style.animation = 'none'; void card.offsetWidth; card.style.animation = '';
    if (!matchMedia('(prefers-reduced-motion: reduce)').matches) confetti();
  }
  async function hideCheer() {
    cheer.classList.add('out');
    await wait(340);
    cheer.hidden = true;
    cancelAnimationFrame(confRaf);
    cctx.setTransform(1, 0, 0, 1, 0, 0);
    cctx.clearRect(0, 0, conf.width, conf.height);
  }
  function confetti() {
    const s = Math.min(DPR, 2);
    conf.width = Math.round(W * s); conf.height = Math.round(H * s);
    const cx = W / 2, cy = H / 2, parts = [];
    for (let i = 0; i < 90; i++) {
      const a = Math.random() * Math.PI * 2, v = 5 + Math.random() * 9;
      parts.push({
        x: cx, y: cy, vx: Math.cos(a) * v, vy: Math.sin(a) * v - 4,
        r: 5 + Math.random() * 7, rot: Math.random() * 6, vr: (Math.random() - 0.5) * 0.4,
        c: FUN[i % FUN.length], k: i % 3,
      });
    }
    const t0 = performance.now();
    cancelAnimationFrame(confRaf);
    (function frame(now) {
      const life = (now - t0) / 1700;
      cctx.setTransform(s, 0, 0, s, 0, 0);
      cctx.clearRect(0, 0, W, H);
      if (life >= 1) return;
      cctx.globalAlpha = life > 0.7 ? (1 - life) / 0.3 : 1;
      for (const p of parts) {
        p.vy += 0.35; p.vx *= 0.985; p.x += p.vx; p.y += p.vy; p.rot += p.vr;
        cctx.save(); cctx.translate(p.x, p.y); cctx.rotate(p.rot); cctx.fillStyle = p.c;
        if (p.k === 0) { cctx.beginPath(); cctx.arc(0, 0, p.r * 0.6, 0, Math.PI * 2); cctx.fill(); }
        else if (p.k === 1) cctx.fillRect(-p.r * 0.7, -p.r * 0.35, p.r * 1.4, p.r * 0.7);
        else {
          cctx.beginPath();
          for (let j = 0; j < 10; j++) {
            const rr = j % 2 ? p.r * 0.45 : p.r, aa = j * Math.PI / 5 - Math.PI / 2;
            cctx.lineTo(Math.cos(aa) * rr, Math.sin(aa) * rr);
          }
          cctx.closePath(); cctx.fill();
        }
        cctx.restore();
      }
      cctx.globalAlpha = 1;
      confRaf = requestAnimationFrame(frame);
    })(t0);
  }

  async function celebrate() {
    advancing = true;
    snapshot();
    drawGuide(true);
    const k = Math.floor(Math.random() * PRAISE.length);
    showCheer(PRAISE[k]);
    chime();
    setTimeout(() => playClip('P' + k), 300);
    await wait(1600);
    await hideCheer();            // the message is gone before the next letter arrives
    const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
    const n = SETS[trace.set].chars.length, last = trace.idx === n - 1;
    if (!reduce) await slide(['translateX(0)', 'translateX(-105%)'], 'ease-in');
    stepLetter(1);
    if (!reduce) await slide(['translateX(105%)', 'translateX(0)'], 'ease-out');
    advancing = false;
    if (last) { completed[trace.set] = true; renderSetDl(); showFinish(trace.set); }
    else say();
  }
  const wait = (ms) => new Promise((r) => setTimeout(r, ms));
  function slide(frames, easing) {
    const opts = { duration: 320, easing, fill: 'forwards' };
    const anims = [ink, guide].map((el) => el.animate ? el.animate(frames.map((t) => ({ transform: t })), opts) : null).filter(Boolean);
    return Promise.all(anims.map((a) => a.finished.catch(() => {}))).then(() => anims.forEach((a) => a.cancel()));
  }

  /* ---------------- Sounds ---------------- */
  let ac = null;
  function initAudio() {
    try {
      if (!ac) ac = new (window.AudioContext || window.webkitAudioContext)();
      if (ac.state === 'suspended') ac.resume();
    } catch (_) {}
  }
  function chime() {
    if (!ac) return;
    const t = ac.currentTime;
    [523.25, 659.25, 783.99, 1046.5].forEach((f, i) => {
      const o = ac.createOscillator(), g = ac.createGain(), s = t + i * 0.09;
      o.type = 'triangle'; o.frequency.value = f;
      g.gain.setValueAtTime(0, s);
      g.gain.linearRampToValueAtTime(0.14, s + 0.02);
      g.gain.exponentialRampToValueAtTime(0.001, s + 0.5);
      o.connect(g); g.connect(ac.destination);
      o.start(s); o.stop(s + 0.55);
    });
  }

  // Recorded natural voice clips (Kokoro neural TTS, generated once, stored in this file)
  let CLIPS = {};
  try { CLIPS = JSON.parse(document.getElementById('voiceClips').textContent); } catch (_) {}
  const buffers = {};
  let playing = null;
  function playBuffer(buf) {
    if (playing) { try { playing.stop(); } catch (_) {} }
    const src = ac.createBufferSource();
    src.buffer = buf; src.connect(ac.destination); src.start();
    playing = src;
  }
  const decode = (ab) => new Promise((ok, bad) => ac.decodeAudioData(ab, ok, bad));
  async function playClip(key) {
    initAudio();
    if (!ac || !CLIPS[key]) return;
    try {
      let buf = buffers[key];
      if (!buf) {
        const bin = atob(CLIPS[key]), u8 = new Uint8Array(bin.length);
        for (let i = 0; i < bin.length; i++) u8[i] = bin.charCodeAt(i);
        buf = buffers[key] = await decode(u8.buffer);
      }
      playBuffer(buf);
    } catch (_) { toast('Could not play the sound'); }
  }

  // Optional Arabic recordings: put mp3 files in a "sounds/arabic/" folder next to this page
  // (alif.mp3, ba.mp3 …). When a file is there it is used; otherwise the built-in voice plays.
  const AR_FILES = ['alif', 'ba', 'ta', 'tha', 'jiim', 'hha', 'kha', 'daal', 'thaal', 'ra', 'zay', 'siin', 'shiin', 'saad',
    'daad', 'taa', 'thaa', 'ayn', 'ghayn', 'fa', 'qaf', 'kaf', 'lam', 'miim', 'nuun', 'ha', 'waw', 'ya'];
  const external = {};          // url -> AudioBuffer, or null when the file is missing
  async function playExternal(url) {
    initAudio();
    if (!ac) return false;
    if (!(url in external)) {
      try {
        const r = await fetch(url, { cache: 'force-cache' });
        external[url] = r.ok ? await decode(await r.arrayBuffer()) : null;
      } catch (_) { external[url] = null; }
    }
    if (!external[url]) return false;
    playBuffer(external[url]);
    return true;
  }

  async function say() {
    const i = trace.idx;
    if (trace.set === 'arabic' && await playExternal(`sounds/arabic/${AR_FILES[i]}.mp3`)) return;
    const pre = { upper: 'L', lower: 'L', num: 'N', thaana: 'T', arabic: 'A' }[trace.set];
    playClip(pre + i);
  }
  $('#sayL').onclick = () => say();

  if (document.fonts) {
    Promise.all([
      document.fonts.load('700 100px Andika', 'Aag'),
      document.fonts.load('500 100px "Noto Sans Thaana"', thaana[0]),
      document.fonts.load('500 100px "MV Aammu FK"', thaana[0]),
      document.fonts.load('500 100px "Noto Naskh Arabic"', 'ب'),
    ]).catch(() => {}).then(drawGuide);
    document.fonts.ready.then(drawGuide);
  }

  /* ---------------- Save as image ---------------- */
  let dlNs = null;
  try { window.claude?.use?.('downloads')?.then((n) => { dlNs = n; }).catch(() => {}); } catch (_) {}

  $('#save').onclick = () => {
    const out = document.createElement('canvas');
    out.width = ink.width; out.height = ink.height;
    const o = out.getContext('2d');
    o.fillStyle = BG; o.fillRect(0, 0, out.width, out.height);
    if (trace.on) o.drawImage(guide, 0, 0);
    o.drawImage(ink, 0, 0);
    const d = new Date(), z = (n) => String(n).padStart(2, '0');
    const name = `drawing-${d.getFullYear()}-${z(d.getMonth() + 1)}-${z(d.getDate())}-${z(d.getHours())}${z(d.getMinutes())}.png`;
    savePng(out, name);
  };
  function savePng(canvas, name) {
    canvas.toBlob(async (blob) => {
      if (!blob) { toast('Could not make the picture. Try again.'); return; }
      if (dlNs) {
        try { await dlNs.save({ filename: name, data: blob }); toast('Picture saved'); }
        catch (err) { toast(err && err.code === 'declined' ? 'Not saved' : 'Saving is not available here'); }
        return;
      }
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url; a.download = name;
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 5000);
      toast('Picture saved');
    }, 'image/png');
  }

  /* ---------------- Keepsake: every traced letter of a set in one picture ---------------- */
  const snaps = { upper: [], lower: [], num: [], thaana: [], arabic: [] };
  const completed = {};
  const TILE_H = 240;
  function snapshot() {
    if (!geom) return;
    const c = geom.crop, sc = TILE_H / c.h;
    const t = document.createElement('canvas');
    t.width = Math.max(1, Math.round(c.w * sc)); t.height = TILE_H;
    const o = t.getContext('2d');
    o.fillStyle = BG; o.fillRect(0, 0, t.width, t.height);
    const sx = Math.round(c.x * DPR), sy = Math.round(c.y * DPR);
    const sw = Math.min(guide.width - sx, Math.round(c.w * DPR)), sh = Math.min(guide.height - sy, Math.round(c.h * DPR));
    o.drawImage(guide, sx, sy, sw, sh, 0, 0, t.width, t.height);
    o.drawImage(ink, sx, sy, sw, sh, 0, 0, t.width, t.height);
    snaps[trace.set][trace.idx] = t;
  }
  function watermark(o, x, y, size, align) {
    const a = 'crafted by ', b = 'clickandcraft', c = ' in Milandhoo';
    o.font = `400 ${size}px Andika, sans-serif`;
    const wa = o.measureText(a).width, wc = o.measureText(c).width;
    o.font = `700 ${size}px Andika, sans-serif`;
    const wb = o.measureText(b).width;
    const total = wa + wb + wc;
    let x0 = align === 'center' ? x - total / 2 : align === 'right' ? x - total : x;
    o.textAlign = 'left'; o.textBaseline = 'alphabetic';
    o.font = `400 ${size}px Andika, sans-serif`; o.fillStyle = '#8d94b8';
    o.fillText(a, x0, y);
    const g = o.createLinearGradient(x0 + wa, 0, x0 + wa + wb, 0);
    ['#ff4d5e', '#ff8a2a', '#ffe14d', '#7be36b', '#4dc3ff', '#a77bff', '#ff6ec7'].forEach((col, i, arr) => g.addColorStop(i / (arr.length - 1), col));
    o.font = `700 ${size}px Andika, sans-serif`; o.fillStyle = g;
    o.fillText(b, x0 + wa, y);
    o.font = `400 ${size}px Andika, sans-serif`; o.fillStyle = '#8d94b8';
    o.fillText(c, x0 + wa + wb, y);
  }
  function buildCollage(key) {
    const set = SETS[key], n = set.chars.length, tiles = snaps[key];
    const first = tiles.find(Boolean);
    const tw = first ? first.width : Math.round(TILE_H * 0.8), th = TILE_H;
    const cols = Math.min(n, Math.ceil(Math.sqrt(n * 1.6))), rows = Math.ceil(n / cols);
    const gap = 14, m = 40, head = 120, foot = 80;
    const cv = document.createElement('canvas');
    cv.width = m * 2 + cols * tw + (cols - 1) * gap;
    cv.height = head + rows * th + (rows - 1) * gap + foot;
    const o = cv.getContext('2d');
    o.fillStyle = '#0b0e18'; o.fillRect(0, 0, cv.width, cv.height);
    // header
    o.textBaseline = 'alphabetic'; o.textAlign = 'left';
    o.font = '700 64px Caveat, "Comic Sans MS", cursive'; o.fillStyle = '#ffd84a';
    o.fillText('My Board', m, 78);
    const titleW = o.measureText('My Board').width;
    o.font = '700 30px Andika, sans-serif'; o.fillStyle = '#eef0fa';
    o.fillText(`${set.name}  ${set.label}`, m + titleW + 24, 74);
    const d = new Date();
    o.font = '400 22px Andika, sans-serif'; o.fillStyle = '#8d94b8'; o.textAlign = 'right';
    o.fillText(d.toLocaleDateString(undefined, { year: 'numeric', month: 'long', day: 'numeric' }), cv.width - m, 74);
    // tiles (right-to-left for Thaana and Arabic)
    for (let i = 0; i < n; i++) {
      const r = Math.floor(i / cols); let c = i % cols;
      if (set.rtl) c = cols - 1 - c;
      const x = m + c * (tw + gap), y = head + r * (th + gap);
      o.save();
      o.beginPath(); o.roundRect ? o.roundRect(x, y, tw, th, 16) : o.rect(x, y, tw, th); o.clip();
      if (tiles[i]) o.drawImage(tiles[i], x, y, tw, th);
      else {
        o.fillStyle = '#141828'; o.fillRect(x, y, tw, th);
        o.font = `${set.weight} ${th * 0.55}px ${set.font}`; o.textAlign = 'center'; o.textBaseline = 'middle';
        o.direction = set.rtl ? 'rtl' : 'ltr';
        o.fillStyle = 'rgba(238,240,250,0.12)'; o.fillText(set.chars[i], x + tw / 2, y + th / 2);
        o.direction = 'ltr';
      }
      o.restore();
      o.strokeStyle = '#313858'; o.lineWidth = 2;
      o.beginPath(); o.roundRect ? o.roundRect(x, y, tw, th, 16) : o.rect(x, y, tw, th); o.stroke();
    }
    // faint diagonal watermark across the picture, and a clear one at the bottom
    o.save();
    o.translate(cv.width / 2, (head + cv.height - foot) / 2); o.rotate(-0.35);
    o.globalAlpha = 0.07; o.font = `700 ${Math.round(cv.width / 14)}px Andika, sans-serif`;
    o.fillStyle = '#ffffff'; o.textAlign = 'center'; o.textBaseline = 'middle';
    o.fillText('crafted by clickandcraft in Milandhoo', 0, 0);
    o.restore();
    watermark(o, cv.width / 2, cv.height - 32, 26, 'center');
    return cv;
  }
  let finishKey = null;
  function showFinish(key) {
    finishKey = key;
    const cv = buildCollage(key);
    const pv = $('#finishPreview');
    const maxW = W - $('.side.left').offsetWidth - $('.side.right').offsetWidth - 100, maxH = H - 170;
    const sc = Math.min(maxW / cv.width, maxH / cv.height, 1);
    pv.width = Math.round(cv.width * sc * DPR); pv.height = Math.round(cv.height * sc * DPR);
    pv.style.width = Math.round(cv.width * sc) + 'px'; pv.style.height = Math.round(cv.height * sc) + 'px';
    pv.getContext('2d').drawImage(cv, 0, 0, pv.width, pv.height);
    $('#finishTitle').textContent = `You traced all the ${SETS[key].name.toLowerCase()}!`;
    $('#finish').hidden = false;
    playClip('P' + Math.floor(Math.random() * 6));
  }
  function downloadSet(key) {
    const d = new Date(), z = (x) => String(x).padStart(2, '0');
    savePng(buildCollage(key), `my-board-${key}-${d.getFullYear()}-${z(d.getMonth() + 1)}-${z(d.getDate())}.png`);
  }
  function renderSetDl() { $('#setDl').hidden = !completed[trace.set]; }
  $('#finishDl').onclick = () => { if (finishKey) downloadSet(finishKey); };
  $('#finishClose').onclick = () => { $('#finish').hidden = true; say(); };
  $('#setDl').onclick = () => showFinish(trace.set);

  /* ---------------- Full screen ---------------- */
  const root = document.documentElement;
  const isFs = () => !!(document.fullscreenElement || document.webkitFullscreenElement);
  async function enterFs(silent) {
    const req = root.requestFullscreen || root.webkitRequestFullscreen;
    if (!req) { if (!silent) toast('Full screen is not supported on this browser'); return false; }
    try {
      await req.call(root, { navigationUI: 'hide' });
      return true;
    }
    catch (_) { if (!silent) toast('Full screen was blocked here'); return false; }
  }
  function exitFs() {
    const ex = document.exitFullscreen || document.webkitExitFullscreen;
    if (ex && isFs()) ex.call(document).catch?.(() => {});
  }
  function renderFs() {
    $('#fsIcon').innerHTML = isFs()
      ? '<path d="M9 4v5H4M15 4v5h5M9 20v-5H4M15 20v-5h5"/>'
      : '<path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/>';
    $('#fsText').textContent = isFs() ? 'Exit full screen' : 'Full screen';
  }
  $('#fs').onclick = () => { isFs() ? exitFs() : enterFs(false); };
  document.addEventListener('fullscreenchange', renderFs);
  document.addEventListener('webkitfullscreenchange', renderFs);

  /* ---------------- Screen stays awake ---------------- */
  let wake = null;
  async function keepAwake() {
    if (wake || !('wakeLock' in navigator) || document.visibilityState !== 'visible') return;
    try { wake = await navigator.wakeLock.request('screen'); wake.addEventListener('release', () => { wake = null; }); } catch (_) {}
  }
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') keepAwake(); });

  /* ---------------- Child lock ---------------- */
  const lockBtn = $('#lock'), ring = lockBtn.querySelector('.ring');
  const HOLD_MS = 1800;
  let holdStart = 0, holdRaf = 0;
  const LOCKED_ICON = '<rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/>';
  const OPEN_ICON = '<rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 0 1 7.5-2"/>';

  function setLocked(v) {
    locked = v;
    document.body.classList.toggle('locked', v);
    $('#lockIcon').innerHTML = v ? LOCKED_ICON : OPEN_ICON;
    lockBtn.setAttribute('aria-label', v ? 'Locked. Hold to unlock' : 'Child lock');
    closeSheet();
    if (v) {
      try { history.pushState({ slate: 'lock' }, ''); } catch (_) {}
      if (!isFs()) enterFs(true).then((ok) => { wantFs = ok; });
      else wantFs = true;
      keepAwake();
      toast('Locked. Hold the lock for 2 seconds to unlock.');
    } else {
      wantFs = false;
      toast('Unlocked');
    }
  }
  window.addEventListener('popstate', () => { if (locked) { try { history.pushState({ slate: 'lock' }, ''); } catch (_) {} } });
  window.addEventListener('beforeunload', (e) => { if (locked) { e.preventDefault(); e.returnValue = ''; } });

  function holdTick() {
    const p = Math.min(1, (performance.now() - holdStart) / HOLD_MS);
    ring.style.setProperty('--p', p);
    if (p >= 1) { cancelHold(); setLocked(false); return; }
    holdRaf = requestAnimationFrame(holdTick);
  }
  function cancelHold() { cancelAnimationFrame(holdRaf); holdStart = 0; ring.style.setProperty('--p', 0); }
  lockBtn.addEventListener('pointerdown', (e) => {
    if (!locked) return;
    e.preventDefault();
    holdStart = performance.now();
    holdRaf = requestAnimationFrame(holdTick);
  });
  ['pointerup', 'pointerleave', 'pointercancel'].forEach((t) => lockBtn.addEventListener(t, () => {
    if (!holdStart) return;
    if (t === 'pointerup' && locked) toast('Keep holding the lock to unlock');
    cancelHold();
  }));
  lockBtn.addEventListener('click', () => { if (!locked) setLocked(true); });

  /* ---------------- Toast ---------------- */
  const toastEl = $('#toast');
  let toastT = 0;
  function toast(msg) {
    toastEl.textContent = msg; toastEl.hidden = false; toastEl.style.opacity = '1';
    clearTimeout(toastT);
    toastT = setTimeout(() => { toastEl.style.opacity = '0'; setTimeout(() => { toastEl.hidden = true; }, 220); }, 2400);
  }

  /* ---------------- Start-up animation (about 4 seconds, tap to skip) ---------------- */
  (async function splashIntro() {
    const splash = $('#splash'), wordEl = $('#splashWord');
    const word = 'My Board';
    const colors = ['#ff4d5e', '#ff8a2a', null, '#ffe14d', '#7be36b', '#4dc3ff', '#a77bff', '#ff6ec7'];
    let done = false;
    const finish = () => {
      if (done) return; done = true;
      splash.classList.add('gone');
      setTimeout(() => splash.remove(), 650);
    };
    splash.addEventListener('pointerdown', finish);
    // wait (briefly) for the handwriting font so letters never swap mid-animation
    try { await Promise.race([document.fonts.load('700 120px Caveat', word), wait(900)]); } catch (_) {}
    let d = 0.15;
    const STEP = 0.27;
    [...word].forEach((ch, i) => {
      const sp = document.createElement('span');
      if (ch === ' ') { sp.className = 'gap'; d += STEP * 0.4; }
      else {
        sp.textContent = ch;
        sp.style.color = colors[i] || '#eef0fa';
        sp.style.setProperty('--d', d.toFixed(2) + 's');
        d += STEP;
      }
      wordEl.appendChild(sp);
    });
    document.querySelector('.splash-line path').style.setProperty('--d', (d + 0.25).toFixed(2) + 's');
    const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
    setTimeout(finish, reduce ? 1500 : 4200);
  })();

  /* ---------------- Start ---------------- */
  $('#lockIcon').innerHTML = OPEN_ICON;
  pickColor(color);
  setTool('pen');
  resize();
  updateUndo();
  renderFs();
})();
</script>
</body>
</html>
